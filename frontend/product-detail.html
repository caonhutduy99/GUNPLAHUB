
<!DOCTYPE html>
<html lang="vi">
<head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="text-white text-decoration-none">
                <h1 class="h3 mb-0">GunplaHub</h1>
            </a>

            <nav>
                <a href="index.html" class="text-white text-decoration-none me-3">

                    Sản phẩm
                </a>
            </nav>
        </div>
    </header>

    <!-- Nội dung chi tiết sản phẩm -->
    <main class="container my-5">
        <h2 class="mb-4">Chi tiết sản phẩm Gundam</h2>

        <div class="row g-4">
            <!-- Hình ảnh sản phẩm -->
            <div class="col-12 col-md-6">
                
<img
    id="detail-image"
    src="assets/images/gundam-hg-001.jpg"
    alt="Mô hình Gundam HG 1/144 RX-0 Unicorn Gundam 03 Phenex (Destroy Mode) (Narrative Ver.) - Bandai"
    class="img-fluid rounded"
>
            </div>

            <!-- Thông tin sản phẩm -->
            <div class="col-12 col-md-6">
                <h3 id="detail-name">Gundam HG 001</h3>

                <p id="detail-price" class="text-danger fs-3 fw-bold">
    250.000 VNĐ
</p>

                <p id="detail-description">
            Mô hình Gundam HG 001 dành cho người yêu thích
    lắp ráp và sưu tầm mô hình Gundam.
</p>

<p>
    <strong>Mã sản phẩm:</strong>
    <span id="detail-code">HG-001</span>
</p>

<p>
    <strong>Phân loại:</strong>
    <span id="detail-type">High Grade (HG)</span>
</p>


                
<button
    type="button"
    id="detail-add-to-cart"
    class="btn btn-primary"
>
    Thêm vào giỏ hàng
</button>

            </div>
        </div>

    <!-- Footer -->
    <footer class="site-footer mt-5">
