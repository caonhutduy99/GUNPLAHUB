
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - GunplaHub</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS chung của GunplaHub -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS riêng cho đăng nhập, đăng ký -->
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-container">
        <a href="index.html" class="auth-logo">GunplaHub</a>

        <p class="auth-subtitle">Gundam Model Store</p>

        <h1 class="auth-title">Đăng nhập</h1>
        <p class="text-center text-secondary mb-4">
            Chào mừng bạn quay trở lại!
        </p>

        <form class="auth-form" id="login-form">
            <div class="mb-3">
                <label for="login-email" class="form-label">
                    Email
                </label>
                <input
                    type="email"
                    class="form-control"
                    id="login-email"
                    name="email"
                    placeholder="Nhập email của bạn"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="login-password" class="form-label">
                    Mật khẩu
                </label>
                <input
                    type="password"
                    class="form-control"
                    id="login-password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    required
                >
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember-me"
                    >
                    <label class="form-check-label" for="remember-me">
                        Ghi nhớ đăng nhập
                    </label>
                </div>
            </div>

            <button type="submit" class="auth-submit">
                Đăng nhập
            </button>
        </form>

        <p class="auth-switch">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
        </p>

        <a href="index.html" class="auth-back">
            ← Quay lại trang chủ
        </a>
    </main>

</body>
</html>

</html>
